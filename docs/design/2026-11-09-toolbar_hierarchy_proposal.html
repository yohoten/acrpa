<div style="font-family:var(--font-sans); color:var(--color-text-primary); max-width:680px;">

      <span style="background:#5F5E5A;color:#fff;font-size:12px;padding:5px 10px;border-radius:4px;">版本</span>
    </div>
  </div>

  <div style="background:var(--color-background-primary); border:2px solid var(--color-border-info); border-radius:var(--border-radius-lg); padding:14px 16px;">

    <div style="display:flex; flex-wrap:wrap; gap:6px; align-items:center;">

      <span style="font-size:12px; color:var(--color-text-secondary);"><span style="display:inline-block;width:10px;height:10px;border:1px solid #E24B4A;border-radius:2px;margin-right:5px;vertical-align:-1px;"></span>Danger 描边红·危险操作</span>
