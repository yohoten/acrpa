[pytest]
; 方案文档 S4：pytest 工程化。tests/ 下均为 _test_*.py 独立脚本，
; 由 tests/conftest.py 的 pytest_collect_file 钩子包成子进程用例，无需 python_files 匹配。
testpaths = tests

markers =
    gui: 需要真实显示器/窗口的 UI 冒烟测试 (用 -m gui 单独跑)
    slow: 慢速测试 (网络/端到端/打包门禁/重计算)

; 默认只跑「纯逻辑」快速集；gui / slow 分别用 -m gui / -m slow 单独跑。
addopts = -m "not gui and not slow"
